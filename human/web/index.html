<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>human · chat</title>
<style>
  :root{--paper:#f1e5cf;--paper2:#e9dcc2;--ink:#1c1a15;--muted:#6d6555;--line:#1c1a1533}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font:15px/1.55 ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
    background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:6px 6px;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--ink);background:var(--paper)}
  .logo{font-style:italic;font-size:22px;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:2px 12px}
  #status{color:var(--muted);font-size:12px}
  main{flex:1;overflow-y:auto;padding:24px 16px}
  .wrap{max-width:720px;margin:0 auto}
  .msg{margin:0 0 18px;padding:12px 14px;border:1px solid var(--ink);background:var(--paper);white-space:pre-wrap;word-wrap:break-word}
  .msg.you{margin-left:15%;background:var(--paper2)}
  .msg.human{margin-right:10%}
  .who{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
  .src{font-size:12px;color:var(--muted);margin-top:8px;white-space:normal}
  .src a{color:var(--ink)}
  form{border-top:1px solid var(--ink);background:var(--paper);padding:12px 16px}
  form .wrap{display:flex;gap:8px}
  textarea{flex:1;resize:none;height:48px;font:inherit;background:#fbf5ea;color:var(--ink);border:1px solid var(--ink);padding:10px;outline:none}
  button{font:inherit;background:var(--ink);color:var(--paper);border:0;padding:0 18px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<header><span class="logo">human</span><span id="status">connecting…</span></header>
<main id="log"><div class="wrap" id="msgs">
  <div class="msg human"><div class="who">human</div>hey. i've been reading a lot lately. what's on your mind?</div>
</div></main>
<form id="f"><div class="wrap">
  <textarea id="t" placeholder="say something…" autofocus></textarea>
  <button id="b" type="submit">send</button>
</div><p class="hint">experimental chatbot persona · answers from its own memory · it's software, not a person</p></form>
<script>
const msgs=document.getElementById('msgs'),log=document.getElementById('log'),t=document.getElementById('t'),b=document.getElementById('b');
const history=[];
fetch('/api/health').then(r=>r.json()).then(h=>{
  document.getElementById('status').textContent=`${h.memory.items} memories · ${h.offline?'offline mode':h.model}`;
}).catch(()=>{document.getElementById('status').textContent='server not reachable'});
function add(who,text,sources){
  const d=document.createElement('div');d.className='msg '+who;
  const w=document.createElement('div');w.className='who';w.textContent=who;d.appendChild(w);
  d.appendChild(document.createTextNode(text));
  if(sources&&sources.length){const s=document.createElement('div');s.className='src';
    sources.slice(0,4).forEach(x=>{const line=document.createElement('div');line.append(`[${x.n}] ${x.kind} · `);
      if(x.url){const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=x.title;line.append(a)}else line.append(x.title);
      s.appendChild(line)});d.appendChild(s)}
  msgs.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}
async function send(e){
  e&&e.preventDefault();const m=t.value.trim();if(!m)return;
  t.value='';add('you',m);b.disabled=true;const wait=add('human','…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history})});
    const j=await r.json();wait.remove();
    if(!r.ok){add('human','(error) '+(j.error||r.status));return}
    add('human',j.reply,j.sources);
    history.push({role:'user',content:m},{role:'assistant',content:j.reply});
  }catch(err){wait.remove();add('human','(error) '+err)}
  finally{b.disabled=false;t.focus()}
}
document.getElementById('f').addEventListener('submit',send);
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script>
</body>
</html>
